spring.application.name=backend

# Do not expose backend exception messages to API clients by default.
server.error.include-message=never

spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.chat.enabled=${APP_CHAT_ENABLED:true}
firebase.credentials.path=${FIREBASE_CREDENTIALS:}
firebase.credentials.json-base64=${FIREBASE_CREDENTIALS_JSON_BASE64:}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
# Must reach a running FastMCP HTTP server (same host/port as mcp_server MCP_PORT, default 8000 locally).
spring.ai.mcp.client.streamable-http.connections.mcp.url=${MCP_SERVER_ORIGIN:http://localhost:8000}
spring.ai.mcp.client.streamable-http.connections.mcp.endpoint=${MCP_SERVER_ENDPOINT:/mcp}
spring.ai.mcp.client.request-timeout=60s
