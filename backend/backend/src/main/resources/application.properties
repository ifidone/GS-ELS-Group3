spring.application.name=backend

server.port=${SERVER_PORT:8080}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
firebase.credentials.path=${FIREBASE_CREDENTIALS:/absolute/path/to/service-account.json}

spring.datasource.url=${DB_URL:jdbc:postgresql://34.174.253.132:5432/users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:GS@12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true