<div class="chatbot-backdrop" *ngIf="isOpen" (click)="closeChat()" aria-hidden="true"></div>

<div class="chatbot-container" *ngIf="isOpen" role="dialog" aria-labelledby="chatbot-title">
  <div class="chatbot-inner">
    <header class="chat-header">
      <div class="chat-header-left">
        <span class="chat-header-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M12 3v18M12 12l7.2-4.2M12 12l-7.2 4.2"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
            />
            <path
              d="M12 12 A6 6 0 0 1 18 8"
              fill="currentColor"
              fill-opacity="0.35"
              stroke="currentColor"
              stroke-width="0.6"
            />
          </svg>
        </span>
        <h2 id="chatbot-title" class="chat-title">Mutual Fund Advisor</h2>
      </div>
      <button type="button" class="chat-close" (click)="closeChat()" aria-label="Close chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <div class="chat-body">
      <p class="msg-bot">Hello! I'm here to help select the right mutual funds for you. What would you like to focus on?</p>

      <div class="focus-options" *ngIf="!hideFocusOptions">
        <button
          type="button"
          class="focus-option"
          *ngFor="let opt of focusOptions"
          [class.focus-option--accent]="opt.id === 'fees'"
          [disabled]="isLoading"
          (click)="onFocusOption(opt.prompt)"
        >
          <span class="focus-option-icon">
            @switch (opt.icon) {
              @case ('growth') {
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M4 18V6M8 14V10M12 16V8M16 11v7M20 7v11"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                  <path
                    d="M3 18h18M14 8l3-3 3 3"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              }
              @case ('value') {
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M12 3l2.2 6.8H21l-5.5 4 2.1 6.7L12 16.5 6.4 20.5l2.1-6.7L3 9.8h6.8L12 3z"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linejoin="round"
                    fill="currentColor"
                    fill-opacity="0.15"
                  />
                </svg>
              }
              @case ('income') {
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4" />
                  <path
                    d="M12 7v10M10 9.5h2.2a1.3 1.3 0 010 2.6H10M10 14.5h2.5a1.5 1.5 0 010 3H10"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linecap="round"
                  />
                </svg>
              }
              @case ('fees') {
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <ellipse cx="8" cy="16" rx="3" ry="2" stroke="currentColor" stroke-width="1.3" />
                  <ellipse cx="16" cy="14" rx="3" ry="2" stroke="currentColor" stroke-width="1.3" />
                  <ellipse cx="12" cy="10" rx="3" ry="2" stroke="currentColor" stroke-width="1.3" />
                  <path d="M18 6v4M16 8h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                </svg>
              }
            }
          </span>
          <span class="focus-option-label">{{ opt.label }}</span>
          <span class="focus-option-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <ng-container *ngFor="let msg of messages">
        <p class="msg-user" *ngIf="msg.sender === 'User'">{{ msg.text }}</p>
        <div class="msg-bot msg-bot--rich" *ngIf="msg.sender === 'Bot'" [innerHTML]="msg.html ?? msg.text"></div>
      </ng-container>

      <p class="msg-bot msg-bot--followup" *ngIf="messages.length > 0 && !isLoading">
        Great! What else can I help with?
      </p>

      <div class="suggested-pills" *ngIf="messages.length > 0 && !isLoading">
        <button
          type="button"
          class="suggested-pill"
          *ngFor="let q of suggestedQuestions"
          [disabled]="isLoading"
          (click)="onSuggestedQuestion(q)"
        >
          <span class="suggested-pill-arrow" aria-hidden="true"></span>
          <span>{{ q }}</span>
        </button>
      </div>

      <p class="chat-loading" *ngIf="isLoading">Thinking…</p>
    </div>

    <footer class="chat-footer">
      <input
        class="chat-input"
        [(ngModel)]="userInput"
        placeholder="Type your question..."
        [disabled]="isLoading"
        (keydown.enter)="sendMessage(); $event.preventDefault()"
      />
      <button
        type="button"
        class="chat-send"
        (click)="sendMessage()"
        [disabled]="isLoading || !userInput.trim()"
        aria-label="Send message"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </footer>
  </div>
</div>

<button
  type="button"
  class="chatbot-button"
  (click)="toggleChat()"
  [attr.aria-expanded]="isOpen"
  aria-label="Open mutual fund advisor chat"
>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path
      d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 018.5-8.5c2.27 0 4.4.88 6 2.5 1.62 1.6 2.5 3.73 2.5 6z"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="9" cy="11.5" r="1.2" fill="currentColor" />
    <circle cx="12" cy="11.5" r="1.2" fill="currentColor" />
    <circle cx="15" cy="11.5" r="1.2" fill="currentColor" />
  </svg>
</button>
